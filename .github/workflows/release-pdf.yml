name: Release PDF

on:
  pull_request:
    paths:
      - "*.md"
      - "scripts/**"
      - ".github/workflows/release-pdf.yml"
      - ".github/workflows/release-summary.md"
      - ".github/workflows/release-summary.lock.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "[0-9][0-9]_*.md"
      - "scripts/**"
      - ".github/workflows/release-pdf.yml"
      - ".github/workflows/release-summary.md"
      - ".github/workflows/release-summary.lock.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pdf-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      summary: ${{ steps.summary.outputs.summary }}
      summary_mode: ${{ steps.summary.outputs.summary_mode }}
      guide_diff: ${{ steps.summary.outputs.guide_diff }}
      author: ${{ steps.author.outputs.author }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine version and previous release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date_part="$(date -u +%F)"
          tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${date_part}" --jq '.[].ref' | sed 's|^refs/tags/||')"
          version="$date_part"
          n=1
          while grep -qxF "$version" <<<"$tags"; do
            n=$((n + 1))
            version="${date_part}.${n}"
          done
          prev_tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            git fetch --no-tags origin "refs/tags/${prev_tag}:refs/tags/${prev_tag}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release summary input
        id: summary
        env:
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          mkdir -p build
          summary="$(scripts/summarize_diff.sh "$PREV_TAG" build/guide-content.diff)"
          if [ "$summary" = "SEMANTIC_SUMMARY_REQUIRED" ]; then
            delimiter="ghaw_$(cat /proc/sys/kernel/random/uuid)"
            while grep -Fqx "$delimiter" build/guide-content.diff; do
              delimiter="ghaw_$(cat /proc/sys/kernel/random/uuid)"
            done
            {
              echo "guide_diff<<$delimiter"
              cat build/guide-content.diff
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            echo "summary_mode=semantic" >> "$GITHUB_OUTPUT"
          else
            test -n "$summary"
            echo "summary_mode=deterministic" >> "$GITHUB_OUTPUT"
            echo "summary=$summary" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve revision author
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          scripts/resolve_author.sh "$GITHUB_SHA" "$PR_NUMBER" "$GITHUB_ACTOR" | tee build/author.txt
          echo "author=$(cat build/author.txt)" >> "$GITHUB_OUTPUT"

  semantic-summary:
    name: Generate semantic release summary
    needs: prepare
    if: needs.prepare.outputs.summary_mode == 'semantic'
    uses: ./.github/workflows/release-summary.lock.yml
    with:
      guide_diff: ${{ needs.prepare.outputs.guide_diff }}
    permissions:
      contents: read
      actions: read
      copilot-requests: write

  build:
    name: Build PDF
    needs: [prepare, semantic-summary]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.semantic-summary.result == 'success' ||
      (needs.prepare.outputs.summary_mode != 'semantic' && needs.semantic-summary.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu jq
          # Mermaid diagrams are rendered with mermaid-cli, using the runner's preinstalled Chrome.
          PUPPETEER_SKIP_DOWNLOAD=true npm install --prefix "$RUNNER_TEMP/mermaid" @mermaid-js/mermaid-cli@11.12.0
          echo "MMDC=$RUNNER_TEMP/mermaid/node_modules/.bin/mmdc" >> "$GITHUB_ENV"
          echo "MERMAID_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Download semantic summary
        if: needs.prepare.outputs.summary_mode == 'semantic'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-summary
          path: build/semantic-summary

      - name: Validate and select release summary
        env:
          SUMMARY_MODE: ${{ needs.prepare.outputs.summary_mode }}
          DETERMINISTIC_SUMMARY: ${{ needs.prepare.outputs.summary }}
        run: |
          mkdir -p build
          if [ "$SUMMARY_MODE" = "semantic" ]; then
            scripts/validate_release_summary.sh build/semantic-summary/release-summary.txt > build/release-notes.txt
          else
            printf '%s\n' "$DETERMINISTIC_SUMMARY" > build/release-notes.txt
          fi
          test -s build/release-notes.txt

      - name: Generate revision history
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          AUTHOR: ${{ needs.prepare.outputs.author }}
        run: |
          scripts/revisions_table.sh "$VERSION" "$(date -u +%F)" "$AUTHOR" "$(cat build/release-notes.txt)" > build/revisions.md

      - name: Build PDF
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIEW: ${{ github.event_name == 'pull_request' }}
        run: |
          preview=""
          if [ "$PREVIEW" = "true" ]; then preview="preview"; fi
          scripts/build_pdf.sh "$VERSION" build/revisions.md "$preview"

      - name: Validate PDF
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIEW: ${{ github.event_name == 'pull_request' }}
        run: |
          suffix=""
          if [ "$PREVIEW" = "true" ]; then suffix="-PREVIEW"; fi
          pdf="build/ai-security-101-${VERSION}${suffix}.pdf"
          test -s "$pdf"
          head -c 5 "$pdf" | grep -q '^%PDF-'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-security-101-pdf
          path: |
            build/ai-security-101-*.pdf
            build/release-notes.txt
            build/author.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-security-101-pdf
          path: build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Hidden marker so later revision tables credit the human, not the publishing bot.
          { cat build/release-notes.txt; printf '\n\n<!-- author: %s -->\n' "$(cat build/author.txt)"; } > build/release-body.md
          gh release create "$VERSION" \
            "build/ai-security-101-${VERSION}.pdf" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI Security 101 — $VERSION" \
            --notes-file build/release-body.md
